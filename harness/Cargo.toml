[package]
name = "harness"
version = "0.4.3"
edition = "2024"
license = "Apache-2.0"
description = "Catapult agent harness: sandboxed tools, orchestrator and subagents"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
walkdir = "2"
glob = "0.3"
regex = "1"
